<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backipedia</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="backipedia-popup">
  <header>
    <h1>Backipedia</h1>
    <p class="tagline">Manuscripts don't burn.</p>
  </header>

  <main>
    <section class="settings">
      <label for="year-select">Historical year</label>
      <select id="year-select">
        <option value="2022" selected>2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
      </select>
    </section>

    <section class="toggle">
      <label>
        <input type="checkbox" id="enabled-toggle" checked />
        Enable Historical View on Wikipedia
      </label>
    </section>

    <footer>
      <span class="version">v0.1.0</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
